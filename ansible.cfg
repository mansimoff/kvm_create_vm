# Конфигурация ansible для этого проекта.
[defaults]
# inventory указывать при запуске не нужно: ansible-playbook create_vm.yml -K
inventory = inventory.yml
# Роли (rhel/, ubuntu/, debian/, cloud/) лежат прямо в корне проекта,
# а не в стандартном подкаталоге roles/ — добавляем корень в пути поиска.
roles_path = ./
interpreter_python = auto_silent
