# --- Обязательные параметры ---

# Семейство ОС (выбирает роль и механизм установки в режиме iso):
#   rhel     — Rocky / Alma / CentOS Stream / RHEL (Kickstart + OEMDRV-ISO)
#   ubuntu   — Ubuntu Server 20.04+ (autoinstall + cidata-ISO)
#   debian   — Debian 11/12 netinst / DVD (preseed, remaster ISO через xorriso)
#   freebsd  — FreeBSD 13/14/15 disc1 (bsdinstall script, remaster ISO)
#   opensuse — openSUSE Leap / Tumbleweed DVD (AutoYaST + OEMDRV-ISO)
#   cloud    — устаревший способ: готовый cloud-образ qcow2, БЕЗ установки
#              (эквивалентно install_mode: cloud; ОС определяется по cloud_image)
os_family: debian

# Режим работы:
#   iso   — установка с установочного ISO (по умолчанию);
#   cloud — готовый cloud-образ qcow2, БЕЗ установки (cloud-init).
# Для os_family: cloud значение игнорируется (всегда cloud).
install_mode: iso

vm_name: voip
vm_memory_mb: 2048
vm_vcpus: 2
vm_disk_size: 20G

# Путь до установочного ISO (только для install_mode: iso).
# При запуске плейбук показывает этот путь — Enter оставить, можно ввести другой.
# Требования к образам:
#   rhel     — полный DVD-ISO, НЕ boot.iso/netinstall (пакеты берутся с ISO);
#   ubuntu   — live-server ISO (Desktop 20.04–22.04 не поддерживается);
#   debian   — netinst или DVD (зеркало не используется);
#   freebsd  — disc1 ISO (НЕ bootonly: в нём нет base.txz/kernel.txz);
#   opensuse — полный DVD ISO (НЕ Online-ISO: в нём нет пакетов).
iso_path: /home/ruslan/downloads/distrib/Linux/debian-13.7.0-amd64-netinst.iso

# Публичный SSH-ключ пользователя
ssh_pub_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIbjVO7dx42edDaKW9E0SQ+OveLeEHRrLhKZg3aQ31xl ruslan@HP-Laptop-15s"

# Хеш пароля (НЕ сам пароль). Сгенерировать:
#   openssl passwd -6 'мойпароль'
vm_password_hash: "$6$HrA8hwf1GF.qP4A7$SLltGmM1Ay8cbdT/9ojsqyWIUixnc8ij/0LHALtXOB4sLXOR82q7KboNSXFx0pDnjxfYKl2hS6VoHcpo80ZKX."

# --- Необязательные параметры ---

# Зеркало apt для autoinstall-установки Ubuntu (шаг configure_apt —
# apt-get update в таргете). archive.ubuntu.com из РФ может быть
# недоступен/медленный — тогда установка падает и virt-install висит.
apt_mirror: http://mirror.yandex.ru/ubuntu/

# Сколько минут virt-install ждёт завершения установки (-1 — вечно).
# При зависании инсталлятора (например, недоступный репозиторий) плейбук
# вместо бесконечного ожидания завершится по таймауту.
vm_install_timeout_min: 90

vm_user: ruslan              # пользователь внутри VM, sudo NOPASSWD (+wheel для rhel/freebsd)
os_variant: generic         # rocky10 / ubuntu24.04 / debian12 / opensuse-leap15.6 / freebsd15.0 и т.п., если есть в `osinfo-query os`; иначе generic
timezone: Europe/Moscow

# --- Сеть ---
#
# Режим libvirt-сети (vm_network_mode):
#   nat    — обычная NAT-сеть libvirt (по умолчанию, поведение как раньше).
#            Если сети с именем vm_network ещё нет, она будет создана
#            с параметрами vm_network_gateway / vm_netmask / dhcp-диапазона.
#   bridge — libvirt-сеть на базе СУЩЕСТВУЮЩЕГО моста хоста (vm_bridge).
#            Сам мост нужно создать заранее средствами ОС хоста
#            (NetworkManager / systemd-networkd / brctl); плейбук создаёт
#            только описание libvirt-сети поверх него.
#
# ВАЖНО: параметры NAT-сети применяются только при её СОЗДАНИИ. Если сеть
# с таким именем уже существует, плейбук использует её как есть. Чтобы
# применить новые значения, удалите сеть:
#   virsh net-destroy <имя> && virsh net-undefine <имя>
vm_network_mode: nat
vm_network: default          # имя libvirt-сети

# Параметры NAT-сети (по умолчанию — стандартная сеть libvirt 192.168.122.0/24)
vm_network_gateway: 192.168.122.1
vm_netmask: 255.255.255.0    # /24
vm_prefix: 24                # то же, что vm_netmask, но в виде префикса (для netplan/cloud-init)
vm_network_dhcp_start: 192.168.122.100
vm_network_dhcp_end: 192.168.122.254

# Мост хоста для vm_network_mode: bridge
vm_bridge: br0

# Как гость получает IP:
#   dhcp   — по DHCP (по умолчанию; для NAT раздаёт dnsmasq libvirt,
#            для bridge — внешний DHCP-сервер в этом мосту);
#   static — задать вручную (vm_ip обязателен, шлюз по умолчанию —
#            vm_network_gateway, маска — vm_netmask).
vm_ip_mode: static
vm_ip: "192.168.122.253"
vm_gateway: ""               # пусто → vm_network_gateway
vm_dns: ""                   # пусто → vm_gateway (или vm_network_gateway)

# --- Только для install_mode: cloud (или os_family: cloud) ---
#
# Cloud-образ — это готовая qcow2 с уже установленной ОС (инсталлятора нет,
# VM стартует за ~минуту). Плейбук создаёт overlay-диск поверх образа и
# seed-ISO с cloud-init (пользователь, SSH-ключ, пароль).
#
# cloud_image — путь ЛИБО URL до qcow2 cloud-образа.
# URL при первом запуске скачается в images_dir и дальше переиспользуется.
# При запуске плейбук показывает это значение — Enter оставить, можно ввести другое.
#
# cloud_os — ОС внутри образа (rhel / ubuntu / debian / opensuse / freebsd).
# Обычно определяется автоматически по имени cloud_image; задайте явно,
# если имя файла не содержит название ОС.
#
# cloud_image: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base.x86_64.qcow2
#   (Alma:    https://repo.almalinux.org/almalinux/10/cloud/x86_64/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2)
#   (Ubuntu:  https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img)
#   (Debian:  https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2)
#   (FreeBSD: https://download.freebsd.org/releases/VM-IMAGES/15.1-RELEASE/amd64/Latest/FreeBSD-15.1-RELEASE-amd64-BASIC-CLOUDINIT-zfs.qcow2.xz
#    — .xz распаковывается автоматически; для FreeBSD user-data использует
#      shell: /bin/sh, sudo ставится best-effort через pkg; см. cloud/README.md)
#   (openSUSE: https://download.opensuse.org/repositories/Cloud:/Images:/Leap_15.6/images/openSUSE-Leap-15.6.x86_64-NoCloud.qcow2)
# cloud_image: /var/lib/libvirt/images/Rocky-10-GenericCloud-Base.x86_64.qcow2
cloud_image: ""
#
# vm_disk_size для cloud необязателен: без него overlay наследует размер образа.
